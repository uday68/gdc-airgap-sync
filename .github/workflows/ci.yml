name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit Tests, Race Detection & Static Analysis
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        go-version: [ '1.22', '1.23' ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v ./...

      - name: Run Race Detector (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -v ./...

      - name: Build CLI Binary
        run: go build -v -o bin/airgap-sync ./cmd/airgap-sync
